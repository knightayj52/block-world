<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#193d36"><title>모아섬 · 영쌤클래스</title><link rel="stylesheet" href="style.css?v=03">
<canvas id="view" aria-label="3D 블록 숲"></canvas>
<header><b>◆ 모아섬</b><span id="status">영쌤클래스</span><button id="cardbutton" hidden>건축 카드</button><button id="menu">월드 메뉴</button></header>
<main id="panel"><small>영쌤클래스 · 블록 월드</small><h1>모아섬</h1><p>숲을 걷고, 나무를 모아<br>나만의 작은 집을 지어 보세요.</p><div id="resume"><label>저장한 월드<select id="saved"></select></label><button id="solo" class="primary">이어서 놀기 →</button></div>
<label>새 월드 이름<input id="worldname" maxlength="24" placeholder="예: 물빛마을"></label><label>시작 지형<select id="biome"><option value="forest">숲속 빈터</option><option value="island">바닷가 작은 섬</option><option value="canyon">바위 협곡</option></select></label><button id="newworld" class="primary">새 기기 월드 만들기 →</button>
<details><summary>학급 월드 · 친구와 함께하기</summary><div id="online"></div></details><details><summary>조작 방법</summary><p>시점 버튼으로 3인칭과 1인칭을 전환하세요. 왼쪽 패드로 이동하고 화면을 끌어 둘러보세요. 중앙 십자선을 가까운 블록에 맞춘 뒤 캐기 또는 놓기를 누르세요. 나무 1개로 판자 4개를 만듭니다.</p><p>키보드 W A S D 이동 · 방향키 시점 · 스페이스 점프 · Q 캐기 · E 놓기</p></details><output id="msg"></output></main>
<section id="hud" hidden><button id="perspective" title="1인칭과 3인칭 전환">시점 · 3인칭</button><i id="aim">＋</i><div id="pad" aria-label="이동 패드"><b>✥</b></div><div id="actions"><button id="signbutton" hidden>표지판 문구</button><button id="jump">↑ 점프</button><button id="mine">⛏ 캐기</button><button id="place">＋ 놓기</button></div><div id="belt"></div><aside id="tip" aria-live="polite"></aside></section>
<script src="config.js"></script><script src="terrain.js"></script><script src="biomes.js"></script><script src="recipes.js"></script><script src="workshop.js"></script><script src="perspective.js"></script><script src="game.js?v=03"></script><script src="online.js"></script><dialog id="craftdlg"><small>건축 재료</small><h2>작업대</h2><div id="recipes"></div><button id="craftclose">닫기</button></dialog><dialog id="card"><small>선택 건축 카드</small><h2 id="cardname"></h2><p id="cardbody"></p><button id="cardclose">월드로 돌아가기</button></dialog>
<dialog id="signdlg"><label>새로 놓을 표지판의 문구<input id="signinput" maxlength="24"></label><button id="signconfirm">문구 적용</button></dialog><script>attachWorkshop()</script></html>
